<div class="header">
  <h1>Gestión de Usuarios</h1>
  <button mat-raised-button color="primary" (click)="openDialog()">
    Nuevo Usuario
  </button>

  <app-custom-table
    [data]="usersForTable()"
    [columns]="columns"
    (edit)="handleEdit($event)"
    (delete)="handleDelete($event)">
  </app-custom-table>
</div>
